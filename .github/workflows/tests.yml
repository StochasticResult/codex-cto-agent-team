name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Validate, Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill metadata, assets, links, and standalone package
        run: python scripts/validate_repo.py --verify-package

      - name: Install lint and type tools
        run: python -m pip install --upgrade pip ruff mypy

      - name: Run ruff lint check
        run: ruff check .

      - name: Run mypy type check
        run: mypy skills scripts examples tests

  unit-and-demo:
    name: Unit Tests & Demo (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

      - name: Run reproducible end-to-end demo
        run: python examples/end_to_end_demo/run_demo.py --verify
