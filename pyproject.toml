[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".git", "__pycache__", "dist", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = '(dist|build|__pycache__)'
