name: Bug report
description: Report a bug in cto-agent-team scripts, schemas, packaging, or documentation
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue.
        **Privacy reminder:** Please remove any private filesystem paths, API keys, credentials, real thread UUIDs, and internal hostnames before submitting.
  - type: dropdown
    id: host
    attributes:
      label: Agent Host / Environment
      description: Which host runtime or CLI were you using?
      options:
        - Codex Desktop
        - Codex CLI
        - Google Antigravity
        - Claude Code
        - Cursor
        - Standalone Python scripts (no host)
        - Other
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - SKILL.md / references
        - team_state.py
        - model_route.py / routing schema
        - agent_guard.py
        - examples / end_to_end_demo
        - CI / packaging / install
    validations:
      required: true
  - type: input
    id: os_python
    attributes:
      label: OS and Python Version
      placeholder: "e.g., Windows 11 / Ubuntu 24.04 / macOS 15, Python 3.12.7"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands, anonymized fixtures, or workflow steps that triggered the bug.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized Command Output or Logs
      render: text
